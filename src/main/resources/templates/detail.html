<!doctype html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="/main.css">
</head>
<body>

<div th:replace="~{ nav.html::navbar }"></div>

<div class="card">
    <h4>상세페이지</h4>
    <img src="https://placehold.co/300">
    <h4 th:text="${ data.title }"></h4>
    <p th:text="${ data.price + '원' }"></p>
</div>

<!-- 댓글 UI -->
<div class="card">
    <h4>댓글</h4>

    <div th:if="${#lists.isEmpty(comments)}">아직 댓글이 없습니다.</div>

    <div th:each="c : ${comments}" style="border-top:1px solid #eee; padding:8px 0;">
        <b th:text="${c.username}">username</b>
        <p th:text="${c.content}" style="margin:4px 0 0 0;">내용</p>
    </div>
</div>

<!-- 댓글 작성 폼 -->
<form action="/comment" method="POST">
    <input name="content">
    <input type="hidden" name="parentId" th:value="${data.id}">
    <button>댓글입력</button>
</form>

</body>
</html>
