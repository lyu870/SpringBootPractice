<!doctype html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="/main.css">
</head>
<body>

<div th:replace="~{ nav.html::navbar }"></div>

<!-- 검색창 -->
<form action="/search" method="POST">
    <input name="searchText" style="display:inline" th:value="${query}">
    <button type="submit">검색</button>
    <!-- 검색 중이면 전체보기 링크 노출 -->
    <a th:if="${searchMode}" href="/list/page/1" style="margin-left:8px;">전체 보기</a>
</form>

<!-- 검색 결과 헤더 -->
<div th:if="${searchMode}" class="card" style="margin-top:8px;">
    <strong th:text="'검색결과 : \'' + ${query} + '\' (' + ${count} + '건)'"></strong>
</div>

<!-- 게시글 리스트 -->
<div th:if="${#lists.isEmpty(items)}" class="card">검색 결과가 없습니다.</div>
<div class="card" th:each="i : ${items}">
    <img src="https://placehold.co/300">
    <div>
        <!-- 내부적으로 getTitle() 호출. -->
        <h4><a th:href="@{'/detail/' + ${i.id}}" th:text="${i.title}"></a></h4>
        <p th:text="${i.price}"></p>
        <a th:href="@{'/edit/' + ${i.id}}">✏️</a>
        <button class="delete-btn" th:data-id="${i.id}">삭제</button>
    </div>
</div>

<!-- 목록 모드 페이지네이션: 검색이 아닐 때만 보이기 -->
<nav class="pagination" th:if="${!#bools.isTrue(searchMode)}">

    <!-- 1) "첫페이지" & "이전" -->
    <!-- current > 1 일때 (첫 페이지가 아니면) 노출 -->
    <span th:if="${current > 1}">
    <a th:href="@{|/list/page/1|}">첫페이지</a>
    <a th:href="@{|/list/page/${current-1}|}">이전</a>
  </span>

    <!-- 2) 가운데 숫자 버튼들 (최대 5개: startPage ~ endPage) -->
    <span th:each="p : ${#numbers.sequence(startPage, endPage)}" style="margin:0 4px;">
    <!-- 현재 페이지가 아니면 링크 -->
    <a th:if="${p != current}"
       th:href="@{|/list/page/${p}|}"
       th:text="${p}"></a>
        <!-- 현재 페이지면 강조 표시 -->
    <strong th:if="${p == current}"
            th:text="${p}"
            style="font-weight:bold; text-decoration:underline;"></strong>
  </span>

    <!-- 3) "다음" & "마지막페이지" -->
    <!-- current < totalPages 일때 (마지막 페이지가 아니라면) 노출 -->
    <span th:if="${current < totalPages}">
    <a th:href="@{|/list/page/${current+1}|}">다음</a>
    <a th:href="@{|/list/page/${totalPages}|}">마지막페이지</a>
  </span>
</nav>

<!-- 검색 모드 페이지네이션: 검색일 때만 보이기 (q 파라미터 유지해주기) -->
<nav class="pagination" th:if="${#bools.isTrue(searchMode)}">

    <!-- 1) "첫페이지" & "이전" -->
    <!-- current > 1 (첫 페이지가 아니면)만 노출 -->
    <span th:if="${current > 1}">
    <a th:href="@{|/search/page/1?q=${query}|}">첫페이지</a>
    <a th:href="@{|/search/page/${current-1}?q=${query}|}">이전</a>
  </span>

    <!-- 2) 가운데 숫자 버튼들 (최대 5개: startPage ~ endPage) -->
    <span th:each="p : ${#numbers.sequence(startPage, endPage)}" style="margin:0 4px;">
    <!-- 현재 페이지가 아니면 링크 -->
    <a th:if="${p != current}"
       th:href="@{|/search/page/${p}?q=${query}|}"
       th:text="${p}"></a>
        <!-- 현재 페이지면 강조 표시 -->
    <strong th:if="${p == current}"
            th:text="${p}"
            style="font-weight:bold; text-decoration:underline;"></strong>
  </span>

    <!-- 3) "다음" & "마지막페이지" -->
    <!-- current < totalPages 일때 (마지막 페이지가 아니라면) 노출 -->
    <span th:if="${current < totalPages}">
    <a th:href="@{|/search/page/${current+1}?q=${query}|}">다음</a>
    <a th:href="@{|/search/page/${totalPages}?q=${query}|}">마지막페이지</a>
  </span>
</nav>

<script>
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const id = this.dataset.id;

        if (!confirm('정말 삭제하시겠습니까?')) return;

        const res = await fetch(`/delete/${id}`, { method: 'DELETE' });

        if (res.ok) {
          alert('삭제했습니다.');
          location.reload(); // 페이지 새로고침
        } else {
          alert('삭제 실패');
        }
      });
    });
</script>

</body>
</html>
