<!doctype html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="/main.css">
</head>
<body>

<!--아이디나 비번 뭐가 틀렸는지 정확히 알려주는 건 보안상 좋지않음.-->
<div th:if="${param.error}">
    <h4>아이디나 비번 틀리셨습니다</h4>
</div>

<div th:replace="~{ nav.html::navbar }"></div>

<form action="/login" method="POST">
    <input name="username" type="text" placeholder="ID">
    <input name="password" type="password" placeholder="PW">
    <button type="submit">로그인</button>
</form>

<form>
    <input name="username" type="text" id="username" placeholder="ID">
    <input name="password" type="password" id="password" placeholder="PW">
</form>
<button onclick="loginJWT()">JWT방식로그인</button>

<button onclick="getMyPage()">마이페이지주세요</button>

<script>
    function loginJWT(){
      fetch('/login/jwt', {
        method : 'POST',
        headers : {'Content-Type': 'application/json'},
        body : JSON.stringify({
          username : document.querySelector('#username').value,
          password : document.querySelector('#password').value
        })
      }).then(r => r.text()).then((r)=>{ console.log(r) })
    }
</script>

<!--마이페이지 요청버튼-->
<script>
    function getMyPage(){
      fetch('/my-page/jwt')
      .then(r => r.text())
      .then(r =>{ console.log(r) })
    }
</script>

</body>
</html>
